name: Run setup-nix
description: Set up Nix environment for GitHub Actions
runs:
  using: composite
  steps:
    - name: Install Nix
      uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35
      with:
        github_access_token: ${{ github.token }}
        nix_conf: |
          access-tokens = github.com=${{ github.token }}
          nix-path = nixpkgs=channel:nixos-unstable
    - name: Setup niks3
      uses: Mic92/niks3-action@bc010bf9dbc79ec59de6c79b1e7a167977d3978b # v1.0.0
      with:
        server-url: https://niks3.yutakobayashi.com
